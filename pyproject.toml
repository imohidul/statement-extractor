[project]
name = "statement-extractor"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Syed Mohidul Islam", email = "isyedmohidul@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pdfplumber>=0.11.10",
    "pycountry>=26.2.16",
    "pydantic>=2.13.5",
]

[project.scripts]
statement-extractor = "statement_extractor:main"

[build-system]
requires = ["uv_build>=0.9.11,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "faker>=40.39.0",
    "reportlab>=5.0.1",
]
